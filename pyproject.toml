[project]
name = "appflowy-mcp"
version = "0.1.0"
description = "MCP server for self-hosted AppFlowy Cloud — create, read, update and search pages via the Cloud REST API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "gunmo" }]
keywords = ["appflowy", "mcp", "model-context-protocol", "claude"]
dependencies = [
    "mcp>=1.25.0",
    "httpx>=0.27.0",
    "markdown-it-py>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
appflowy-mcp = "appflowy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appflowy_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
